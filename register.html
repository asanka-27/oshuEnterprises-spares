<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - OSHU ENTERPRISES</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo-link">OSHU ENTERPRISES</a>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="category.html" class="nav-link">Categories</a>
      <a href="search.html" class="nav-link">Search</a>
      <a href="cart.html" class="nav-link">Cart</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>
  </header>

  <main class="page-content auth-page">
    <section class="auth-card">
      <h2>Create account</h2>
      <p>Register to save orders and get faster checkout.</p>
      <form id="register-form">
        <label>Name</label>
        <input type="text" id="register-name" required />
        <label>Email</label>
        <input type="email" id="register-email" required />
        <label>Password</label>
        <input type="password" id="register-password" required />
        <button type="submit" class="button-primary">Register</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 OSHU ENTERPRISES. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
